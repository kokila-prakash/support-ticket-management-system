<!DOCTYPE html>
<html>
<head><title>Support Ticket System</title>
<style>body{font-family:Arial;padding:30px}input,textarea,select{width:300px;padding:10px;margin:5px}button{padding:10px 20px;background:blue;color:white;border:none}</style>
</head>
<body>
<h2>Submit Support Ticket</h2>
<input id="name" placeholder="Your Name"><br>
<input id="email" placeholder="Your Email"><br>
<textarea id="issue" placeholder="Describe Issue"></textarea><br>
<select id="priority"><option>Low</option><option>Medium</option><option>High</option></select><br>
<button onclick="submitTicket()">Submit Ticket</button>
<p id="result"></p>
<script>
async function submitTicket(){
  const data = {name: document.getElementById('name').value, email: document.getElementById('email').value, issue: document.getElementById('issue').value, priority: document.getElementById('priority').value};
  const res = await fetch('REPLACE_WITH_API_GATEWAY_URL', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(data)});
  const out = await res.json();
  document.getElementById('result').innerText = 'Ticket Created! ID: ' + out.ticketId;
}
</script>
</body>
</html>
